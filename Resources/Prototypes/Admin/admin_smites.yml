- type: adminSmite
  id: AdminSmiteSuperSpeed
  name: admin-smite-super-speed-name
  description: admin-smite-super-speed-description
  icon: Interface/AdminActions/super_speed.png
  operations:
  - !type:AddComponentsSmite
    replaceExisting: true
    components:
    - type: MovementSpeedModifier
      baseWalkSpeed: 400
      baseSprintSpeed: 8000
      baseAcceleration: 40
  - !type:PopupSmite
    message: admin-smite-super-speed-prompt
    recipients: Target
    location: Entity
    type: LargeCaution

- type: adminSmite
  id: AdminSmiteSetAlight
  name: admin-smite-set-alight-name
  description: admin-smite-set-alight-description
  icon: Interface/Alerts/Fire/fire.png
  whitelist:
    components:
    - Flammable
  operations:
  - !type:EntityEffectsSmite
    effects:
    - !type:Flammable
      multiplier: 1000
    - !type:Ignite
  - !type:PopupSmite
    message: admin-smite-set-alight-self
    recipients: Target
    location: Entity
    type: LargeCaution
  - !type:PopupSmite
    message: admin-smite-set-alight-others
    recipients: PvsExceptTarget
    location: Coordinates
    type: MediumCaution

